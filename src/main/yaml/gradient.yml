incarnation: collektive

network-model:
  type: ConnectWithinDistance
  parameters: [50]

_collektive-program: &collektive-program
  - time-distribution: 1
    type: Event
    actions:
      - type: RunCollektiveProgram
        parameters: [it.unibo.collektive.examples.gradient.GradientKt.gradientEntrypoint]

_random-movement: &random-movement
  - time-distribution: 1
    type: Event
    actions:
      - type: BrownianMove
        parameters: [ 5.0 ]

_event-popout: &event-popout
  - time-distribution:
      type: ExponentialTime
      parameters: [0.0005]
    type: Event
    actions:
      - type: it.unibo.alchemist.model.actions.WriteMolecule
        parameters:
          moleculeName: "event"
          moleculeValue: 1.0

_event-disappears: &event-disappears
  - time-distribution:
      type: ExponentialTime
      parameters: [0.01]
    type: Event
    actions:
      - type: it.unibo.alchemist.model.actions.RemoveMolecule
        parameters:
          moleculeName: "event"

_circular-movement: &circular-movement
  - time-distribution: 1
    type: Event
    actions:
      - type: CircularMovement
        parameters:
          radius: 200.0
          center: [ 0.0,0.0 ]
          speed: 5.0

deployments:
  - type: Circle
    parameters: [2000, 0, 0, 400]
    programs:
      - *random-movement
      - *collektive-program
      - *event-popout
      - *event-disappears
  - type: Point
    parameters: [0, 200]
    programs:
      - *circular-movement
      - *collektive-program
      - *event-popout
      - *event-disappears
    contents:
      - molecule: source
        concentration: true